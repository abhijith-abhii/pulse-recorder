[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.0
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:simulated]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSIMULATED_SENSORS=1
